image: hj.pgm           # 导出的PGM文件名（需与图片名一致）
resolution: 0.17            # 地图分辨率（米/像素），需与QGIS导出设置一致
origin: [211912.1325, 3968128.5482, 0.0]  # 原点坐标（左下角的UTM XY值）
occupied_thresh: 0.65      # 障碍物阈值（灰度值高于此视为障碍）
free_thresh: 0.196         # 自由空间阈值（灰度值低于此视为可通行）
negate: 0                  # 是否反转颜色（0表示不反转，黑色为障碍物）